kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "0.0.0.0"
      - containerPort: 30300
        hostPort: 30300
        listenAddress: "0.0.0.0"
      - containerPort: 30900
        hostPort: 30900
        listenAddress: "127.0.0.1"
