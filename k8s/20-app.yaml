apiVersion: apps/v1
kind: Deployment
metadata:
  name: regapp
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: regapp}
  template:
    metadata:
      labels: {app: regapp}
    spec:
      containers:
        - name: regapp
          image: regapp:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_DB}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: regapp
  namespace: demo
  labels: {app: regapp}
spec:
  type: NodePort
  selector: {app: regapp}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080
